services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: factory_monitor
      POSTGRES_USER: factory_user
      POSTGRES_PASSWORD: factory_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_user -d factory_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://factory_user:factory_password_change_me@db:5432/factory_monitor
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-demo-change-this-secret-before-deployment
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      SIMULATOR_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
